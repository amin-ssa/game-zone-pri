<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameZone Priv - Link in Bio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<base target="_blank">
</head>
<body>
    <!-- خلفية الجسيمات 3D -->
    <canvas id="particle-canvas"></canvas>

    <!-- المحتوى الرئيسي -->
    <main class="container">
        <!-- صورة البروفيل -->
        <div class="profile-wrapper floating">
            <div class="profile-img-container">
                <img src="https://i.ibb.co/hJMY7xxy/IMG-3295.jpg" alt="GameZone Priv Profile" class="profile-img">
            </div>
        </div>

        <!-- الاسم -->
        <h1 class="name floating-delay-1">GameZone Priv</h1>

        <!-- أيقونات التواصل الاجتماعي -->
        <div class="social-icons floating-delay-2">
            <a href="https://www.instagram.com/game.zone.pri?igsh=MWtqb2xveW9xNWo0OQ%3D%3D&utm_source=qr" class="social-icon instagram" aria-label="Instagram">
                <i class="fab fa-instagram"></i>
            </a>
            <a href="https://www.youtube.com/@gamezone_pri" class="social-icon youtube" aria-label="YouTube">
                <i class="fab fa-youtube"></i>
            </a>
            <a href="https://www.tiktok.com/@game.zone.pri" class="social-icon tiktok" aria-label="TikTok">
                <i class="fab fa-tiktok"></i>
            </a>
        </div>

        <!-- الزر الرئيسي -->
        <a href="https://amins-a.web.app" class="main-btn floating-delay-3" target="_blank" rel="noopener noreferrer">
            <span class="btn-text">اضغط هنا لدخول الألعاب بدون تحميل</span>
            <span class="btn-icon"><i class="fas fa-gamepad"></i></span>
            <span class="ripple"></span>
        </a>

        <!-- حقوق الطبع والنشر -->
        <footer class="copyright floating-delay-4">
            <p>© 2026 GameZone Priv</p>
        </footer>
    </main>

    <script src="app.js"></script>
</body>
</html>
